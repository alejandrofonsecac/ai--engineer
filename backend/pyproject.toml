[project]
name = "virtual-race-engineer-backend"
version = "0.1.0"
description = "Backend FastAPI do Virtual Race Engineer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.6,<3.0"
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.package-data]
app = ["knowledge/**/*.json"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
